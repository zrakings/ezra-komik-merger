<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Penggabung Gambar ke PDF / CBZ / Gambar</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- jsPDF CDN (untuk membuat file PDF) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <!-- JSZip CDN (untuk membuat file CBZ / ZIP) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-6 flex flex-col items-center justify-start">

    <div class="max-w-3xl w-full bg-slate-800 rounded-xl shadow-2xl p-6 border border-slate-700">
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold text-blue-400 mb-2">Penggabung Gambar ke PDF / CBZ / ZIP</h1>
            <p class="text-slate-400 text-sm">Gabungkan beberapa file gambar menjadi satu PDF, dokumen komik (CBZ), arsip ZIP, atau gambar panjang utuh.</p>
        </div>

        <!-- Area Upload Gambar -->
        <div class="border-2 border-dashed border-slate-600 rounded-lg p-6 text-center hover:border-blue-500 transition cursor-pointer bg-slate-800/50 mb-6" id="drop-zone">
            <input type="file" id="file-input" accept="image/*" multiple class="hidden">
            <label for="file-input" class="cursor-pointer flex flex-col items-center">
                <svg class="w-10 h-10 text-slate-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
                <span class="text-slate-200 font-medium">Klik atau seret beberapa file gambar ke sini</span>
                <span class="text-xs text-slate-500 mt-1">Mendukung PNG, JPG, WEBP, dll.</span>
            </label>
        </div>

        <!-- Pengaturan Nama File, Tata Letak & Opsi Output -->
        <div id="settings-section" class="hidden space-y-4 mb-6 bg-slate-900/50 p-4 rounded-lg border border-slate-700">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Nama File Hasil (Tanpa Ekstensi)</label>
                <input type="text" id="custom-filename" placeholder="Masukkan nama file (contoh: Hasil_Penggabungan)" value="Hasil_Penggabungan" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Format Output</label>
                    <select id="output-type" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="pdf">PDF Document (.pdf)</option>
                        <option value="cbz">Comic Book Archive (.cbz)</option>
                        <option value="zip">ZIP Archive (.zip)</option>
                        <option value="single-image">Gambar Tunggal Disambung</option>
                    </select>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Kualitas Output</label>
                    <select id="quality-preset" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="hd">HD (Kualitas Tinggi, File Lebih Besar)</option>
                        <option value="medium" selected>Medium (Rekomendasi, Seimbang)</option>
                        <option value="small">Kecil (Ukuran File Paling Hemat)</option>
                    </select>
                </div>

                <div id="image-format-container">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Format Gambar Dalam File</label>
                    <select id="output-format" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="image/jpeg" selected>JPEG (Paling Ringan)</option>
                        <option value="image/webp">WEBP</option>
                        <option value="image/png">PNG</option>
                    </select>
                </div>

                <div id="image-direction-container" class="hidden">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Arah Sambungan</label>
                    <select id="layout-direction" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                        <option value="vertical">Vertikal (Atas ke Bawah)</option>
                        <option value="horizontal">Horisontal (Kiri ke Kanan)</option>
                        <option value="grid">Grid (2 Kolom)</option>
                    </select>
                </div>

                <div id="gap-container" class="hidden">
                    <label class="block text-xs font-semibold text-slate-400 uppercase mb-1">Jarak Antar Gambar (px)</label>
                    <input type="number" id="gap-input" value="0" min="0" max="100" class="w-full bg-slate-800 border border-slate-600 rounded px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
                </div>
            </div>
        </div>

        <!-- Daftar Preview Gambar yang Diunggah -->
        <div id="preview-list" class="hidden space-y-2 mb-6 max-h-60 overflow-y-auto pr-2"></div>

        <!-- Informasi Ukuran Total/Selesai -->
        <div id="file-size-info" class="hidden mb-4 p-3 bg-blue-900/30 border border-blue-500/30 rounded-lg text-center text-xs text-blue-300"></div>

        <!-- Tombol Aksi -->
        <div id="action-buttons" class="hidden flex flex-col sm:flex-row gap-3">
            <button id="clear-btn" class="w-full sm:w-1/3 bg-red-600/20 hover:bg-red-600/30 text-red-400 border border-red-500/30 py-2.5 rounded-lg font-medium transition text-sm">
                Hapus Semua
            </button>
            <button id="merge-btn" class="w-full sm:w-2/3 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-lg font-semibold transition text-sm shadow-lg shadow-blue-600/30 flex justify-center items-center gap-2">
                <span>Proses & Download File</span>
            </button>
        </div>

        <div id="status-text" class="mt-4 text-center text-sm font-medium text-slate-400"></div>
        <canvas id="canvas" class="hidden"></canvas>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const previewList = document.getElementById('preview-list');
        const settingsSection = document.getElementById('settings-section');
        const actionButtons = document.getElementById('action-buttons');
        const mergeBtn = document.getElementById('merge-btn');
        const clearBtn = document.getElementById('clear-btn');
        const statusText = document.getElementById('status-text');
        const canvas = document.getElementById('canvas');
        const fileSizeInfo = document.getElementById('file-size-info');

        const outputTypeSelect = document.getElementById('output-type');
        const qualityPresetSelect = document.getElementById('quality-preset');
        const imageDirectionContainer = document.getElementById('image-direction-container');
        const gapContainer = document.getElementById('gap-container');
        const customFilenameInput = document.getElementById('custom-filename');

        let imageFiles = [];

        // Helper untuk memformat ukuran byte ke string KB/MB yang mudah dibaca
        function formatBytes(bytes, decimals = 2) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
        }

        outputTypeSelect.addEventListener('change', () => {
            const val = outputTypeSelect.value;
            if (val === 'single-image') {
                imageDirectionContainer.classList.remove('hidden');
                gapContainer.classList.remove('hidden');
            } else {
                imageDirectionContainer.classList.add('hidden');
                gapContainer.classList.add('hidden');
            }
        });

        fileInput.addEventListener('change', (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            files.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true, sensitivity: 'base' }));
            imageFiles = [...imageFiles, ...files];
            renderPreviewList();
        });

        function renderPreviewList() {
            previewList.innerHTML = '';

            if (imageFiles.length === 0) {
                previewList.classList.add('hidden');
                settingsSection.classList.add('hidden');
                actionButtons.classList.add('hidden');
                fileSizeInfo.classList.add('hidden');
                statusText.innerText = '';
                return;
            }

            previewList.classList.remove('hidden');
            settingsSection.classList.remove('hidden');
            actionButtons.classList.remove('hidden');
            fileSizeInfo.classList.remove('hidden');

            let totalInputBytes = 0;

            imageFiles.forEach((file, index) => {
                totalInputBytes += file.size;
                const item = document.createElement('div');
                item.className = 'flex items-center justify-between bg-slate-700/50 p-2 rounded border border-slate-700 text-xs';
                
                const imgUrl = URL.createObjectURL(file);

                item.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <span class="font-bold text-slate-400 w-6 text-center">${index + 1}</span>
                        <img src="${imgUrl}" class="w-10 h-10 object-cover rounded bg-slate-900 border border-slate-600">
                        <div class="flex flex-col truncate">
                            <span class="truncate text-slate-200 font-medium">${file.name}</span>
                            <span class="text-slate-400 text-[10px]">${formatBytes(file.size)}</span>
                        </div>
                    </div>
                    <button onclick="removeImage(${index})" class="text-red-400 hover:text-red-300 p-1 font-bold ml-2">✕</button>
                `;

                previewList.appendChild(item);
            });

            fileSizeInfo.innerHTML = `Total ukuran gambar asli: <strong>${formatBytes(totalInputBytes)}</strong> (${imageFiles.length} file)`;
            statusText.innerText = `${imageFiles.length} gambar siap diproses.`;
        }

        function removeImage(index) {
            imageFiles.splice(index, 1);
            renderPreviewList();
        }

        clearBtn.addEventListener('click', () => {
            imageFiles = [];
            fileInput.value = '';
            renderPreviewList();
        });

        function getSafeFilename(defaultName) {
            const rawName = customFilenameInput.value.trim();
            if (!rawName) return defaultName;
            return rawName.replace(/[/\\?%*:|"<>]/g, '_');
        }

        function getQualityConfig() {
            const preset = qualityPresetSelect.value;
            if (preset === 'hd') {
                return { maxDimension: 3840, quality: 0.92 };
            } else if (preset === 'small') {
                return { maxDimension: 1080, quality: 0.50 };
            } else {
                return { maxDimension: 1920, quality: 0.75 };
            }
        }

        function getScaledDimensions(width, height, maxDim) {
            if (width <= maxDim && height <= maxDim) {
                return { width, height };
            }
            if (width > height) {
                const ratio = maxDim / width;
                return { width: maxDim, height: Math.round(height * ratio) };
            } else {
                const ratio = maxDim / height;
                return { width: Math.round(width * ratio), height: maxDim };
            }
        }

        mergeBtn.addEventListener('click', async () => {
            if (imageFiles.length === 0) return;

            statusText.innerText = 'Memuat dan mengolah gambar...';
            mergeBtn.disabled = true;

            try {
                const loadedImages = await Promise.all(imageFiles.map(file => {
                    return new Promise((resolve, reject) => {
                        const img = new Image();
                        img.onload = () => resolve({ img, file });
                        img.onerror = reject;
                        img.src = URL.createObjectURL(file);
                    });
                }));

                const outputType = outputTypeSelect.value;
                const format = document.getElementById('output-format').value;
                const filename = getSafeFilename('Hasil_Penggabungan');

                if (outputType === 'pdf') {
                    await generatePDF(loadedImages, format, filename);
                } else if (outputType === 'cbz' || outputType === 'zip') {
                    await generateArchive(loadedImages, outputType, format, filename);
                } else if (outputType === 'single-image') {
                    await generateSingleMergedImage(loadedImages, format, filename);
                }

            } catch (err) {
                console.error(err);
                statusText.innerText = 'Terjadi kesalahan saat memproses file.';
            } finally {
                mergeBtn.disabled = false;
            }
        });

        // 1. Ekspor ke PDF + Menampilkan Ukuran Hasil
        async function generatePDF(loadedImages, format, filename) {
            const { jsPDF } = window.jspdf;
            const { maxDimension, quality } = getQualityConfig();
            let pdf = null;

            for (let i = 0; i < loadedImages.length; i++) {
                const { img } = loadedImages[i];
                const { width, height } = getScaledDimensions(img.width, img.height, maxDimension);
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const imgData = canvas.toDataURL(format, quality);
                const orientation = width > height ? 'l' : 'p';

                if (i === 0) {
                    pdf = new jsPDF({
                        orientation: orientation,
                        unit: 'px',
                        format: [width, height]
                    });
                } else {
                    pdf.addPage([width, height], orientation);
                }

                pdf.addImage(imgData, format === 'image/png' ? 'PNG' : 'JPEG', 0, 0, width, height);
                statusText.innerText = `Menambahkan ke PDF: Halaman ${i + 1} dari ${loadedImages.length}`;
            }

            const pdfBlob = pdf.output('blob');
            const outputSizeStr = formatBytes(pdfBlob.size);
            
            pdf.save(`${filename}.pdf`);
            statusText.innerText = `File PDF berhasil diunduh! (Ukuran Hasil: ${outputSizeStr})`;
            fileSizeInfo.innerHTML += `<br><span class="text-green-400 font-semibold">Ukuran File Hasil Download: ${outputSizeStr}</span>`;
        }

        // 2. Ekspor ke CBZ / ZIP + Menampilkan Ukuran Hasil
        async function generateArchive(loadedImages, extension, format, filename) {
            const zip = new JSZip();
            const ext = format === 'image/jpeg' ? 'jpg' : (format === 'image/webp' ? 'webp' : 'png');
            const { maxDimension, quality } = getQualityConfig();

            for (let i = 0; i < loadedImages.length; i++) {
                const { img } = loadedImages[i];
                const { width, height } = getScaledDimensions(img.width, img.height, maxDimension);
                
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                const dataUrl = canvas.toDataURL(format, quality);
                const base64Data = dataUrl.split(',')[1];
                
                const pageNum = String(i + 1).padStart(3, '0');
                zip.file(`page_${pageNum}.${ext}`, base64Data, { base64: true });

                statusText.innerText = `Menambahkan ke ${extension.toUpperCase()}: Gambar ${i + 1} dari ${loadedImages.length}`;
            }

            statusText.innerText = `Mengompres file ${extension.toUpperCase()}...`;
            const content = await zip.generateAsync({ type: 'blob' });
            const outputSizeStr = formatBytes(content.size);
            
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `${filename}.${extension}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            statusText.innerText = `File ${extension.toUpperCase()} berhasil diunduh! (Ukuran Hasil: ${outputSizeStr})`;
            fileSizeInfo.innerHTML += `<br><span class="text-green-400 font-semibold">Ukuran File Hasil Download: ${outputSizeStr}</span>`;
        }

        // 3. Ekspor ke Gambar Tunggal Disambung + Menampilkan Ukuran Hasil
        async function generateSingleMergedImage(loadedImages, format, filename) {
            const direction = document.getElementById('layout-direction').value;
            const gap = parseInt(document.getElementById('gap-input').value) || 0;
            const { maxDimension, quality } = getQualityConfig();
            const ctx = canvas.getContext('2d');

            const scaledImages = loadedImages.map(item => {
                const dim = getScaledDimensions(item.img.width, item.img.height, maxDimension);
                return { img: item.img, width: dim.width, height: dim.height };
            });

            let totalWidth = 0;
            let totalHeight = 0;

            if (direction === 'vertical') {
                totalWidth = Math.max(...scaledImages.map(item => item.width));
                totalHeight = scaledImages.reduce((sum, item) => sum + item.height, 0) + (gap * (scaledImages.length - 1));

                canvas.width = totalWidth;
                canvas.height = totalHeight;

                if (format === 'image/jpeg') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                let currentY = 0;
                scaledImages.forEach(item => {
                    ctx.drawImage(item.img, 0, currentY, item.width, item.height);
                    currentY += item.height + gap;
                });

            } else if (direction === 'horizontal') {
                totalWidth = scaledImages.reduce((sum, item) => sum + item.width, 0) + (gap * (scaledImages.length - 1));
                totalHeight = Math.max(...scaledImages.map(item => item.height));

                canvas.width = totalWidth;
                canvas.height = totalHeight;

                if (format === 'image/jpeg') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                let currentX = 0;
                scaledImages.forEach(item => {
                    ctx.drawImage(item.img, currentX, 0, item.width, item.height);
                    currentX += item.width + gap;
                });

            } else if (direction === 'grid') {
                const columns = 2;
                const rows = Math.ceil(scaledImages.length / columns);
                const colWidth = Math.max(...scaledImages.map(item => item.width));
                const rowHeight = Math.max(...scaledImages.map(item => item.height));

                canvas.width = (colWidth * columns) + (gap * (columns - 1));
                canvas.height = (rowHeight * rows) + (gap * (rows - 1));

                if (format === 'image/jpeg') {
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                scaledImages.forEach((item, idx) => {
                    const col = idx % columns;
                    const row = Math.floor(idx / columns);
                    const x = col * (colWidth + gap);
                    const y = row * (rowHeight + gap);
                    ctx.drawImage(item.img, x, y, item.width, item.height);
                });
            }

            const ext = format === 'image/jpeg' ? 'jpg' : (format === 'image/webp' ? 'webp' : 'png');
            
            canvas.toBlob((blob) => {
                const outputSizeStr = formatBytes(blob.size);
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `${filename}.${ext}`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

                statusText.innerText = `Gambar berhasil digabungkan dan diunduh! (Ukuran Hasil: ${outputSizeStr})`;
                fileSizeInfo.innerHTML += `<br><span class="text-green-400 font-semibold">Ukuran File Hasil Download: ${outputSizeStr}</span>`;
            }, format, quality);
        }
    </script>
</body>
</html>
